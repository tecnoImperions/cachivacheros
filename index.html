<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Cuenta Confirmada! - Cachivacheros</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      background-color: #1f1f1f;
      color: #e5e5e5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Contenedor principal */
    .container {
      max-width: 480px;
      width: 100%;
      background-color: #2a2a2a;
      border: 1px solid #3d3d3d;
      border-radius: 16px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    /* Imagen de éxito */
    .brand-image {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 24px;
    }

    /* Títulos y textos */
    h1 {
      color: #fbc02d;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 16px;
      color: #cccccc;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    /* Botón de acción */
    .btn {
      display: inline-block;
      background-color: #fbc02d;
      color: #121212;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      padding: 14px 32px;
      border-radius: 10px;
      width: 100%;
      transition: background-color 0.2s ease, transform 0.1s ease;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #f9a825;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Footer */
    footer {
      margin-top: 32px;
      font-size: 13px;
      color: #666666;
    }

    /* Ajustes para pantallas muy pequeñas */
    @media (max-width: 400px) {
      .container {
        padding: 30px 20px;
      }
      h1 {
        font-size: 24px;
      }
      p {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="https://res.cloudinary.com/duwvw6q2c/image/upload/v1777762389/descarga_ao5z8k.png" alt="Cachivacheros" class="brand-image">

    <h1>¡Todo listo!</h1>
    <p>Tu cuenta ha sido confirmada con éxito. Ya puedes volver a la aplicación para iniciar sesión y continuar explorando.</p>

    <a href="https://tu-app-url.com/login" class="btn">Volver a la aplicación</a>
  </div>

  <footer>
    <p style="margin-bottom: 0; font-size: 13px; color: #666666;">© 2026 Cachivacheros</p>
  </footer>

</body>
</html>
