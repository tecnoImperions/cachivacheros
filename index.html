<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Bienvenido! - Cachivacheros</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      background-color: #1f1f1f;
      color: #e5e5e5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Contenedor principal */
    .container {
      max-width: 450px;
      width: 100%;
      background-color: #2a2a2a;
      border: 1px solid #3d3d3d;
      border-radius: 16px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    /* Animación de balanceo para el personaje */
    @keyframes balanceo {
      0% {
        transform: rotate(-6deg);
      }
      50% {
        transform: rotate(6deg);
      }
      100% {
        transform: rotate(-6deg);
      }
    }

    /* Contenedor de la imagen para centrar el eje de rotación abajo */
    .image-container {
      display: inline-block;
      margin-bottom: 24px;
      transform-origin: bottom center;
      animation: balanceo 3s ease-in-out infinite;
    }

    .brand-image {
      width: 130px;
      height: 130px;
      object-fit: contain;
      display: block;
    }

    /* Títulos y textos */
    h1 {
      color: #fbc02d;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 16px;
      color: #cccccc;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .subtext {
      font-size: 14px;
      color: #8e8e8e;
    }

    /* Footer */
    footer {
      margin-top: 32px;
      font-size: 13px;
      color: #555555;
    }

    /* Ajustes para pantallas de celulares */
    @media (max-width: 400px) {
      .container {
        padding: 35px 20px;
      }
      h1 {
        font-size: 24px;
      }
      p {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="image-container">
      <img src="https://res.cloudinary.com/duwvw6q2c/image/upload/v1777762389/descarga_ao5z8k.png" alt="Cachivacheros" class="brand-image">
    </div>

    <h1>¡Has sido aceptado!</h1>
    <p>Tu cuenta ha sido confirmada correctamente.</p>
    <p class="subtext">Ya puedes regresar a la aplicación para iniciar sesión.</p>
  </div>

  <footer>
    <p>© 2026 Cachivacheros</p>
  </footer>

</body>
</html>
